[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fabric-api-examples"
version = "0.1.0"
description = "Typed Python examples for Microsoft Fabric and Power BI REST APIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fabric API Examples Contributors" }]
dependencies = [
  "azure-identity>=1.17.1,<2",
  "httpx>=0.27.2,<1",
  "typing-extensions>=4.10,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
fabric-api = "fabric_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fabric_api"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]
no_site_packages = true
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=fabric_api --cov-report=term-missing"
testpaths = ["tests"]
