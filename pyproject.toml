[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-api-examples"
version = "0.1.0"
description = "Resilient Microsoft Fabric and Power BI REST API examples"
requires-python = ">=3.10"
dependencies = ["azure-identity>=1.25.1", "requests>=2.32.5"]

[project.optional-dependencies]
dev = ["mypy>=1.18.2", "pytest>=8.4.2", "pytest-cov>=6.0", "ruff>=0.13.2"]

[project.scripts]
fabric-api = "fabric_api.cli:main"

[tool.pytest.ini_options]
addopts = "--cov=fabric_api --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
files = ["src", "tests"]
strict = true

[tool.setuptools.packages.find]
where = ["src"]
